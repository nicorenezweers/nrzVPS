[package]
name = "nrz-vps-web"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nrzVPS – Weboberfläche (Dioxus 0.7 + nrzUI)"

[dependencies]
nrz-vps-common = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dioxus = { version = "0.7", features = ["router", "web"] }
icons = { path = "../../vendor/icons", features = ["dioxus"] }
tw_merge = { path = "../../vendor/tw_merge/tw_merge" }
gloo-net = { version = "0.6", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
futures = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Location", "Storage", "File", "FileList", "FormData", "HtmlInputElement", "HtmlElement", "Element", "Navigator", "Clipboard", "Blob", "Url", "EventTarget", "KeyboardEvent", "DataTransfer", "DragEvent", "MouseEvent"] }
strum = { version = "0.28", features = ["derive"] }
chrono = { version = "0.4", default-features = false, features = ["wasmbind", "clock", "std"] }
