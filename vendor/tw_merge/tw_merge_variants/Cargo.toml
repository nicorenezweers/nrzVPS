[package]
name = "tw_merge_variants"
version = "0.1.9"
edition = "2024"
authors = ["Nico Burniske", "Gaucho Labs", "Max Wells"]
description = "Variant macros for tw_merge"
keywords = ["tailwind", "variants", "leptos"]
license = "MIT"
repository = "https://git.zweers.ch/nicorenezweers/nrzUI/src/branch/main/crates/tw_merge"
homepage = "https://ui.zweers.ch"
categories = ["web-programming", "development-tools", "wasm"]
readme = "./README.md"

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
darling = "0.20"

